name: Automated Signal Fetch & Deploy

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch signals & update rankings
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
        run: npm run fetch-signals

      - name: Generate site
        run: npm run generate

      - name: Commit and push changes
        run: |
          git config user.name "VibeRank Bot"
          git config user.email "viberank.tools@gmail.com"
          git add data/tools.json index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: automated signal update $(date -u +'%Y-%m-%d')"
            git push
          fi

      